<!DOCTYPE html>

<body class="m-0 flex min-h-screen flex-col bg-blue font-['Hind',sans-serif] text-white">
  <!-- ===================== HEADER ===================== -->
  <header class="flex h-[87px] w-full items-center gap-4 bg-red px-4 md:px-14">

    <div class="flex justify-center">
      <a href="Beranda.html" class="text-[56px] font-bold leading-none text-yellow no-underline">TIKETAN</a>
    </div>
    <div class="flex flex-col items-center gap-1 md:items-start">
