<!DOCTYPE html>
<html lang="id">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>TIKETAN — Pilih Kursi</title>
	<link rel="stylesheet" href="style.css">
	<script defer src="script.js"></script>
	<style>
	:root {
		--navy: #030017;
		--maroon: #5b160e;
		--maroon-light: #76251b;
		--gold: #facb43;
		--occupied: #85858a;
		--text: #f8f5fb;
		--muted: #c7c2d0;
	}
	* { box-sizing: border-box; }
	body {
		margin: 0;
		background: #f7f7f7;
		color: var(--text);
		font-family: Inter, "Segoe UI", Arial, sans-serif;
	}
	.site {
		width: min(100%, 1000px);
		margin: 0 auto;
		background: var(--navy);
		min-height: 100vh;
		box-shadow: 0 8px 35px #00000012;
	}
	.navbar {
		min-height: 58px;
		padding: 0 28px;
		background: var(--maroon);
		display: flex;
		align-items: center;
		gap: 26px;
	}
	.brand {
		color: var(--gold);
		font-size: 21px;
		font-weight: 900;
		letter-spacing: 1px;
		text-decoration: none;
		white-space: nowrap;
	}
	.search {
		margin: 0 auto;
		width: min(420px, 48%);
		display: flex;
		align-items: center;
		gap: 9px;
		padding: 9px 13px;
		border: 1px solid #8b4237;
		border-radius: 30px;
		background: #71291f;
		color: var(--gold);
	}
	.nav-svg { display: block; width: 22px; height: 22px; flex: 0 0 auto; }
	.search-svg { width: 17px; height: 17px; }
	.search input {
		width: 100%;
		border: 0;
		outline: 0;
		background: transparent;
		color: white;
		font-size: 13px;
	}
	.search input::placeholder { color: #d7b1a7; }
	.nav-icons { display: flex; gap: 20px; color: var(--gold); font-size: 21px; }
	main { padding: 28px clamp(16px, 5vw, 58px) 34px; }
	h1 {
		margin: 0 0 28px;
		text-align: center;
		font-size: clamp(27px, 4vw, 36px);
		font-weight: 800;
		letter-spacing: .3px;
	}
	.screen-wrap {
		width: 68%;
		margin: 0 auto 52px;
		text-align: center;
		position: relative;
		padding-top: 8px;
	}
	.screen-curve {
		width: 100%;
		height: 35px;
		border-top: 4px solid var(--gold);
		border-radius: 50% 50% 0 0 / 100% 100% 0 0;
		transform: perspective(120px) rotateX(4deg);
		filter: drop-shadow(0 0 5px #facb4325);
	}
	.screen-label {
		position: absolute;
		top: 22px;
		left: 0;
		right: 0;
		color: var(--muted);
		font-size: 15px;
	}
	.seats {
		display: flex;
		flex-direction: column;
		gap: clamp(6px, 1.15vw, 12px);
		width: 100%;
		max-width: 760px;
		margin: 0 auto;
	}
	.seat-row {
		display: grid;
		grid-template-columns: repeat(8, minmax(0, 1fr)) clamp(12px, 2.6vw, 26px) repeat(8, minmax(0, 1fr));
		gap: clamp(4px, .8vw, 8px);
		width: 100%;
	}
	.seat {
		appearance: none;
		border: 0;
		min-width: 0;
		aspect-ratio: 1.12 / 1;
		border-radius: 5px;
		background: var(--gold);
		color: #281b00;
		font-size: clamp(9px, 1.3vw, 13px);
		font-weight: 700;
		cursor: pointer;
		transition: transform .14s ease, box-shadow .14s ease, background .14s ease;
	}
	.seat:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 4px 12px #facb4340; }
	.seat.selected { background: var(--maroon-light); color: white; box-shadow: inset 0 0 0 1px #a84b3c; }
	.seat.occupied { background: var(--occupied); color: white; cursor: not-allowed; }
	.seat:focus-visible { outline: 2px solid white; outline-offset: 3px; }
	.legend {
		display: flex;
		justify-content: center;
		align-items: center;
		flex-wrap: wrap;
		gap: 18px;
		margin: 30px 0 25px;
		color: var(--muted);
		font-size: 14px;
	}
	.legend-item { display: inline-flex; align-items: center; gap: 7px; }
	.dot { width: 13px; height: 13px; display: inline-block; border-radius: 4px; }
	.dot.empty { background: var(--gold); }
	.dot.occupied { background: var(--occupied); }
	.dot.selected { background: var(--maroon-light); }
	.summary {
		max-width: 760px;
		margin: 0 auto;
		padding: 16px 18px;
		border: 1px solid #28233e;
		border-radius: 12px;
		background: #09051f;
	}
	.summary-top { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
	.summary-title { font-weight: 750; }
	.count { color: var(--gold); font-size: 14px; white-space: nowrap; }
	.chosen { margin-top: 9px; min-height: 22px; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
	.actions { display: flex; gap: 10px; margin-top: 15px; }
	.btn {
		padding: 10px 16px;
		border: 0;
		border-radius: 7px;
		font-weight: 700;
		cursor: pointer;
	}
	.btn-reset { color: white; background: #29253d; }
	.btn-confirm { margin-left: auto; color: #251900; background: var(--gold); }
	.btn:disabled { opacity: .45; cursor: not-allowed; }
	.message { min-height: 18px; margin-top: 10px; color: var(--gold); font-size: 13px; }
	footer {
		padding: 23px 16px;
		background: var(--maroon);
		text-align: center;
		display: flex;
		flex-direction: column;
		gap: 17px;
		font-size: 18px;
		font-weight: 700;
	}
	footer a { color: white; text-decoration: none; }
	footer a:hover { color: var(--gold); }
	@media (max-width: 520px) {
		.navbar { padding: 0 14px; gap: 12px; min-height: 54px; }
		.brand { font-size: 17px; }
		.search { width: auto; flex: 1; padding: 8px 10px; }
		.nav-icons { gap: 10px; }
		.nav-icons .nav-svg { width: 19px; height: 19px; }
		.search-svg { width: 16px !important; height: 16px !important; }
		.nav-icons .ticket-icon { display: inline-flex; }
		main { padding: 25px 14px 28px; }
		.screen-wrap { width: 82%; margin-bottom: 42px; }
		.seats { gap: 5px; }
		.seat-row { grid-template-columns: repeat(8, minmax(0, 1fr)) 12px repeat(8, minmax(0, 1fr)); gap: 3px; }
		.seat { border-radius: 3px; font-size: clamp(5px, 1.6vw, 8px); }
		.legend { gap: 12px; font-size: 12px; margin-top: 24px; }
		.dot { width: 11px; height: 11px; }
		.summary { padding: 14px; }
		.actions { flex-wrap: wrap; }
		.btn { padding: 10px 12px; }
	}
	</style>
</head>
<body>
	<div class="m-0 bg-blue font-['Hind',sans-serif] text-white">
	  <header class="flex h-[87px] w-full items-center gap-4 bg-red px-4 md:px-14">
		<a href="beranda.html" class="text-[32px] font-bold leading-none text-yellow no-underline md:text-[43px]">TIKETAN</a>

		<!-- Search bar -->
		<div class="mx-auto flex h-[44px] w-full max-w-[688px] items-center gap-3 rounded-2xl bg-white/10 px-3 [box-shadow:0px_6px_15px_0px_rgba(0,0,0,0.25)]">
		  <img src="assets/search.svg" alt="Search" class="h-[29px] w-[29px]" />
		  <input
			type="search"
			placeholder="Search movie here"
			class="w-full border-0 bg-transparent text-[19px] font-light text-yellow outline-none placeholder:text-yellow"
		  />
		</div>

		<!-- Ikon tiket + akun -->
		<nav class="flex items-center gap-10">
		  <a href="#"><img src="assets/Dashboard.svg" alt="My tickets" class="h-[29px] w-[41px]" /></a>
		  <a href="login.html"><img src="assets/Profile.svg" alt="Account" class="h-[29px] w-[30px]" /></a>
		</nav>
	  </header>

		<main>
			<h1>Select Your Seat</h1>
			<div class="screen-wrap" aria-label="Layar bioskop">
			<div class="screen-curve"></div>
			<div class="screen-label">Layar Bioskop</div>
			</div>

			<section class="seats" id="seats" aria-label="Pilih kursi bioskop"></section>

			<div class="legend" aria-label="Keterangan status kursi">
			<span class="legend-item"><i class="dot empty"></i>Kosong</span>
			<span class="legend-item"><i class="dot occupied"></i>Terisi</span>
			<span class="legend-item"><i class="dot selected"></i>Pilihan kamu</span>
			</div>

			<section class="summary" aria-live="polite">
			<div class="summary-top">
				<span class="summary-title">Kursi pilihan kamu</span>
				<span class="count"><span id="count">0</span>/10 kursi</span>
			</div>
			<div class="chosen" id="chosen">Belum ada kursi yang dipilih.</div>
			<div class="actions">
				<button class="btn btn-reset" id="reset" type="button">Reset Pilihan</button>
				<button class="btn btn-confirm" id="confirm" type="button" disabled>Konfirmasi Pilihan</button>
			</div>
			<div class="message" id="message"></div>
			</section>
		</main>

		<footer class="flex min-h-[239px] w-full flex-col items-center justify-center gap-8 bg-red py-8">
			<a href="#" class="text-[43px] font-bold text-white no-underline hover:underline">About Us</a>
			<a href="#" class="text-[43px] font-bold text-white no-underline hover:underline">Contact Us</a>
		</footer>
	</div>
</body>
</html>
